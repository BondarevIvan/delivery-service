services:
  db:
    image: postgres:16-alpine
    container_name: manual-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: app
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d app"]
      interval: 5s
      timeout: 5s
      retries: 5

  coordinator:
    build:
      context: ./coordinator
      dockerfile: Dockerfile
    container_name: manual-coordinator
    environment:
      ORDERS_URL: http://api:8000
    ports:
      - "7777:7777"
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_started

  migrate:
    build:
      context: ./orders
      dockerfile: Dockerfile
    container_name: manual-migrate
    command: ["yoyo", "apply", "--batch"]
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/app
    depends_on:
      db:
        condition: service_healthy

  api:
    build:
      context: ./orders
      dockerfile: Dockerfile
    container_name: manual-api
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/app
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  console:
    build:
      context: ./console
      dockerfile: Dockerfile
    container_name: manual-console
    environment:
      ORDERS_URL: http://api:8000
      COORDINATOR_URL: http://coordinator:7777
      AUTO_DISPATCH_INTERVAL: "3"
    env_file:
      - coordinator/.env
    ports:
      - "8888:8888"
    depends_on:
      - api
      - coordinator

volumes:
  pgdata:
