<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Админка · заказы</title>
<style>
  :root {
    --bg: #0f1117; --panel: #171a23; --panel2: #1e2230; --line: #2a2f3d;
    --text: #e6e9f0; --muted: #98a0b3; --accent: #5b8cff; --accent2: #2b3560;
    --ok: #35c47b; --warn: #e0a83a; --err: #e0574f; --info: #5b8cff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  header {
    padding: 18px 24px; border-bottom: 1px solid var(--line);
    display: flex; align-items: center; gap: 12px; background: var(--panel);
  }
  header h1 { font-size: 18px; margin: 0; font-weight: 650; }
  header .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--accent); }
  main { max-width: 960px; margin: 0 auto; padding: 24px; }
  .search {
    display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end;
    background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
    padding: 16px; margin-bottom: 20px;
  }
  label { display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: var(--muted); }
  input {
    background: var(--panel2); border: 1px solid var(--line); color: var(--text);
    border-radius: 8px; padding: 9px 11px; font-size: 14px; min-width: 220px;
  }
  input:focus { outline: none; border-color: var(--accent); }
  button {
    background: var(--accent); color: #fff; border: 0; border-radius: 8px;
    padding: 10px 18px; font-size: 14px; font-weight: 600; cursor: pointer;
  }
  button:hover { filter: brightness(1.08); }
  button.ghost { background: transparent; border: 1px solid var(--line); color: var(--muted); }
  .msg { padding: 12px 16px; border-radius: 10px; margin-bottom: 16px; display: none; }
  .msg.show { display: block; }
  .msg.err { background: #3a1d1c; border: 1px solid #6b2a26; color: #ffb4ae; }
  .card {
    background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
    padding: 18px 20px; margin-bottom: 18px;
  }
  .card h2 { font-size: 14px; text-transform: uppercase; letter-spacing: .06em;
    color: var(--muted); margin: 0 0 14px; font-weight: 600; }
  .order-head { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  .order-head .id { font-size: 22px; font-weight: 700; }
  .badge { padding: 4px 11px; border-radius: 999px; font-size: 12.5px; font-weight: 600; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px; }
  .kv .k { font-size: 12px; color: var(--muted); margin-bottom: 2px; }
  .kv .v { font-size: 14.5px; word-break: break-word; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 9px 8px; border-bottom: 1px solid var(--line); font-size: 14px; }
  th { color: var(--muted); font-weight: 600; font-size: 12.5px; text-transform: uppercase; letter-spacing: .04em; }
  td.num, th.num { text-align: right; }
  tfoot td { font-weight: 700; border-bottom: 0; }
  .timeline { position: relative; margin-left: 6px; }
  .event { position: relative; padding: 0 0 18px 26px; border-left: 2px solid var(--line); }
  .event:last-child { border-left-color: transparent; padding-bottom: 0; }
  .event::before {
    content: ""; position: absolute; left: -7px; top: 3px; width: 12px; height: 12px;
    border-radius: 50%; background: var(--info); border: 2px solid var(--panel);
  }
  .event .row { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
  .event .st { font-weight: 600; }
  .event .tm { color: var(--muted); font-size: 13px; }
  .event .meta { margin-top: 6px; }
  .event details { margin-top: 6px; }
  .event summary { cursor: pointer; color: var(--muted); font-size: 12.5px; }
  pre {
    background: var(--panel2); border: 1px solid var(--line); border-radius: 8px;
    padding: 10px 12px; overflow: auto; font-size: 12.5px; margin: 8px 0 0;
  }
  .empty { color: var(--muted); text-align: center; padding: 30px; }
  .spinner { display: none; color: var(--muted); }
  .spinner.show { display: inline; }
</style>
</head>
<body>
<header>
  <span class="dot"></span>
  <h1>Админка заказов</h1>
  <span class="spinner" id="spinner">загрузка…</span>
</header>

<main>
  <div class="search">
    <label>Токен (роль admin)
      <input id="token" type="password" placeholder="Bearer-токен" autocomplete="off">
    </label>
    <label>ID заказа
      <input id="orderId" type="number" min="1" placeholder="например, 1">
    </label>
    <button id="load">Показать</button>
    <button id="forget" class="ghost" title="Убрать токен из этого браузера">Забыть токен</button>
  </div>

  <div id="msg" class="msg"></div>
  <div id="result"></div>
</main>

<script>
const STATUS = {
  new:       ["Новый", "var(--info)"],
  started:   ["Готовится", "var(--warn)"],
  ready:     ["Готов", "var(--ok)"],
  assigned:  ["Курьер назначен", "var(--accent)"],
  picked_up: ["В пути", "var(--accent)"],
  delivered: ["Доставлен", "var(--ok)"],
  failed:    ["Не доставлен", "var(--err)"],
  cancelled: ["Отменён", "var(--err)"],
};
const TOKEN_KEY = "orders_admin_token";

const $ = (id) => document.getElementById(id);

function uuid() {
  if (crypto.randomUUID) return crypto.randomUUID();
  return "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g, c => {
    const r = Math.random() * 16 | 0;
    return (c === "x" ? r : (r & 0x3 | 0x8)).toString(16);
  });
}
function esc(s) {
  return String(s).replace(/[&<>"']/g, c =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
function dt(iso) {
  const d = new Date(iso);
  return isNaN(d) ? iso : d.toLocaleString("ru-RU");
}
function money(v) {
  return Number(v).toLocaleString("ru-RU", { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + " ₽";
}
function badge(status) {
  const [label, color] = STATUS[status] || [status, "var(--muted)"];
  return `<span class="badge" style="background:${color}22;color:${color}">${esc(label)}</span>`;
}
function kv(k, v) {
  return `<div class="kv"><div class="k">${esc(k)}</div><div class="v">${v ?? "—"}</div></div>`;
}
function showError(text) {
  const msg = $("msg");
  msg.className = "msg err show";
  msg.textContent = text;
}
function clearMsg() { $("msg").className = "msg"; }

async function loadOrder() {
  clearMsg();
  const token = $("token").value.trim();
  const id = $("orderId").value.trim();
  if (!token) return showError("Укажи админ-токен");
  if (!id) return showError("Укажи id заказа");
  localStorage.setItem(TOKEN_KEY, token);

  $("spinner").classList.add("show");
  try {
    const resp = await fetch(`/order/${encodeURIComponent(id)}`, {
      headers: { "Authorization": `Bearer ${token}`, "RequestId": uuid() },
    });
    if (!resp.ok) {
      let detail = `HTTP ${resp.status}`;
      try { detail = (await resp.json()).detail || detail; } catch (e) {}
      showError(resp.status === 403 ? "Токену нужна роль admin" : detail);
      $("result").innerHTML = "";
      return;
    }
    render(await resp.json());
    location.hash = `order=${id}`;
  } catch (e) {
    showError("Ошибка запроса: " + e.message);
  } finally {
    $("spinner").classList.remove("show");
  }
}

function render(o) {
  const total = o.positions.reduce((s, p) => s + Number(p.cost), 0);
  const positions = o.positions.map(p => `
    <tr>
      <td>${p.position}</td>
      <td>${esc(p.name)}${p.ready ? ' <span class="badge" style="background:var(--ok)22;color:var(--ok)">готово</span>' : ""}</td>
      <td>${p.comment ? esc(p.comment) : ""}</td>
      <td class="num">${money(p.cost)}</td>
    </tr>`).join("") || `<tr><td colspan="4" class="empty">нет позиций</td></tr>`;

  const history = o.history.map(ev => {
    const metaKeys = Object.keys(ev.meta || {});
    const courier = ev.courier_id != null ? ` · курьер #${ev.courier_id}` : "";
    const meta = metaKeys.length
      ? `<details><summary>meta (${metaKeys.length})</summary><pre>${esc(JSON.stringify(ev.meta, null, 2))}</pre></details>`
      : "";
    return `<div class="event">
      <div class="row"><span class="st">${badge(ev.status)}</span>
        <span class="tm">${dt(ev.created_at)}${courier}</span></div>
      ${meta}
    </div>`;
  }).join("") || `<div class="empty">история пуста</div>`;

  const c = o.customer || {};
  $("result").innerHTML = `
    <div class="card">
      <div class="order-head">
        <span class="id">Заказ #${o.order_id}</span>
        ${badge(o.status)}
      </div>
      <div style="height:14px"></div>
      <div class="grid">
        ${kv("Создан", dt(o.created_at))}
        ${kv("Клиент", esc(c.name || "—"))}
        ${kv("Телефон", esc(c.telephone || "—"))}
        ${kv("Адрес", esc(c.address || "—"))}
        ${kv("Комментарий", c.comment ? esc(c.comment) : "—")}
      </div>
    </div>
    <div class="card">
      <h2>Состав заказа</h2>
      <table>
        <thead><tr><th>Позиция</th><th>Блюдо</th><th>Комментарий</th><th class="num">Цена</th></tr></thead>
        <tbody>${positions}</tbody>
        <tfoot><tr><td colspan="3"></td><td class="num">${money(total)}</td></tr></tfoot>
      </table>
    </div>
    <div class="card">
      <h2>История статусов</h2>
      <div class="timeline">${history}</div>
    </div>`;
}

$("load").addEventListener("click", loadOrder);
$("orderId").addEventListener("keydown", e => { if (e.key === "Enter") loadOrder(); });
$("forget").addEventListener("click", () => {
  localStorage.removeItem(TOKEN_KEY);
  $("token").value = "";
});

(function init() {
  const saved = localStorage.getItem(TOKEN_KEY);
  if (saved) $("token").value = saved;
  const m = location.hash.match(/order=(\d+)/);
  if (m) $("orderId").value = m[1];
  if (saved && m) loadOrder();
})();
</script>
</body>
</html>
